# Provider-neutral routing template; adapters must validate and translate this schema.
# Never place credentials here. Model IDs are provider-specific and should be pinned exactly.
schema_version: 2
defaults:
  provider: auto
  model_id: null
  temperature: null
  max_output_tokens: 4096
  timeout_seconds: 120
  max_iterations: 6
  task_budget:
    max_input_tokens: 24000
    max_output_tokens: 12000
    max_total_tokens: 36000
    max_cost_usd: 1.00
  fallback_order: [balanced, fast]
  fallback_enabled: false
  cross_provider_fallback_enabled: false
routing:
  strategy: capability-first
  fallback_enabled: false
  cross_provider_fallback_enabled: false
  require_human_approval_for: [publish, send_message, deploy, purchase, delete, production_change]
model_tiers:
  fast:
    model_id: null
  balanced:
    model_id: null
  deep-reasoning:
    model_id: null
roles:
  planner:
    tier: deep-reasoning
    model_id: null
    fallback_order: [balanced, fast]
    max_input_tokens: 24000
    max_output_tokens: 12000
    max_cost_usd: 1.00
    max_iterations: 5
    timeout_seconds: 180
    requirements: [reasoning, long_context]
  researcher:
    tier: balanced
    model_id: null
    fallback_order: [fast, deep-reasoning]
    max_input_tokens: 24000
    max_output_tokens: 12000
    max_cost_usd: 1.00
    max_iterations: 5
    timeout_seconds: 180
    requirements: [web_search, fetch, citations]
  builder:
    tier: balanced
    model_id: null
    fallback_order: [fast, deep-reasoning]
    max_input_tokens: 24000
    max_output_tokens: 16000
    max_cost_usd: 2.00
    max_iterations: 8
    timeout_seconds: 300
    requirements: [file_edit, shell]
  reviewer:
    tier: deep-reasoning
    model_id: null
    fallback_order: [balanced, fast]
    max_input_tokens: 24000
    max_output_tokens: 10000
    max_cost_usd: 1.00
    max_iterations: 4
    timeout_seconds: 180
    requirements: [read_only_review, reasoning]
  router:
    tier: fast
    model_id: null
    fallback_order: [balanced]
    max_input_tokens: 12000
    max_output_tokens: 3000
    max_cost_usd: 0.25
    max_iterations: 3
    timeout_seconds: 60
    requirements: [instruction_following]
privacy:
  allow_cross_provider_fallback: false
  redact_secrets_before_remote_calls: true
  store_raw_prompts: false
  store_sensitive_personal_data: false

# Tiers are intent labels, not universal model names. Pin exact provider model IDs for reproducibility.
# Never rely on moving aliases such as "latest". Unknown cost must remain unknown, not zero.
# Fallback requires explicit opt-in and budget checks; cross-provider fallback also requires privacy opt-in.
# Adapters must enforce limits or warn clearly when unsupported; this template configures no CLI automatically.
