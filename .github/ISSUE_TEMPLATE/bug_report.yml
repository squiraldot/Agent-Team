name: Bug report
description: Report a reproducible issue in Agent-Team instructions, scripts, hooks, adapters, or configuration.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report bugs with a minimal reproduction. Do not include API keys, credentials, private source code, customer data, or unredacted sensitive traces. If the issue is a runtime mismatch, include the exact client/version and model ID.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, what did you expect, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal, numbered steps using synthetic or sanitized data. Include the exact prompt/task if relevant, with sensitive content removed.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs actual behavior
      placeholder: |
        Expected:
        Actual:
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Agent-Team branch, tag, or commit SHA
      description: Exact commit is preferred.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime/client and exact version
      placeholder: e.g. CLI/editor name and exact version
    validations:
      required: true
  - type: input
    id: provider_model
    attributes:
      label: Provider and exact model ID
      description: Do not include credentials.
  - type: input
    id: install_method
    attributes:
      label: Installation method
      placeholder: direct clone, submodule, or copied configuration
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output or evidence
      description: Include relevant error messages, screenshots, or logs only after removing secrets and personal data.
  - type: textarea
    id: impact
    attributes:
      label: Impact and workaround
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checklist
      options:
        - label: I removed secrets and sensitive data from this report.
          required: true
        - label: I used synthetic or sanitized data and included reproducible steps.
          required: true
        - label: I checked whether the issue may be runtime/version-specific.
          required: false
