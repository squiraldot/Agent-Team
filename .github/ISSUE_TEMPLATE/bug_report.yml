name: Bug report
description: Report a reproducible issue in Agent-Team instructions, scripts, hooks, or configuration.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, credentials, private customer data, or full sensitive traces.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps using synthetic or sanitized data.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: e.g. CLI/editor name and exact version
    validations:
      required: true
  - type: input
    id: provider_model
    attributes:
      label: Provider and exact model ID
      description: Do not include credentials.
  - type: textarea
    id: logs
    attributes:
      label: Redacted output
      description: Include relevant errors only after removing secrets and personal data.
  - type: textarea
    id: impact
    attributes:
      label: Impact and workaround
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checklist
      options:
        - label: I removed secrets and sensitive data from this report.
          required: true
        - label: I checked whether the issue is runtime/version-specific.
          required: false
