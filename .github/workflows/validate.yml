name: Validate Agent-Team

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate repository structure and configuration
        run: python scripts/validate_repo.py

      - name: Check generated platform adapters are synchronized
        run: python scripts/sync_platforms.py --check

      - name: Run installer unit tests and repository tests
        run: python -m unittest discover -s tests -v

      - name: Run local-submodule end-to-end test
        run: bash scripts/e2e_submodule_test.sh

      - name: Check shell syntax
        run: |
          bash -n scripts/e2e_submodule_test.sh
          bash -n run.sh
          for file in .claude/hooks/*.sh; do bash -n "$file"; done

      - name: Parse Claude settings JSON
        run: python -m json.tool .claude/settings.json > /dev/null

      - name: Parse YAML configuration and workflow
        run: |
          ruby -e 'require "yaml"; YAML.load_file("config/agent-team.example.yaml", aliases: false)'
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/validate.yml", aliases: false)'
